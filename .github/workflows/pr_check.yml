name: PR Review Checker

# 注意：dist/templates.toml 是 CI 产物（.github/workflows/bundle.yml 在合入 main 后
# 自动重新聚合并提交），**PR 不需要动它**。本 workflow 只验证「模板能否被聚合成
# bundle」，绝不比对 dist/ 内容，所以贡献者不会被「忘了重新生成」卡住。

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'templates/**/*.toml'
      - 'dist/templates.toml'

jobs:
  validate-toml:
    name: Validate TOML Templates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # 需要 base 提交才能做「仅本次新增文件」的命名比对
          fetch-depth: 0
        
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
      - name: Check TOML Format and Schema
        run: |
          python .github/scripts/validate_templates.py
          
      - name: Check Naming Conventions (new template files only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 只检查本次 PR 新增的 .toml 文件；存量命名（OnePlus_13.toml、huawei_mate_40_pro+.toml、
          # huawei_matepad_10.8英寸.toml 等）是既成事实，不再全树刷屏。
          # 判定逻辑在脚本里（用 Python 显式判定，避免 POSIX 字符类在 C.UTF-8 下误判中文字符）。
          git -c core.quotepath=false diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- templates/ \
            | python .github/scripts/check_new_template_names.py
          
      - name: Check for trailing spaces
        run: |
          # 检查是否有行尾多余的空格，避免不必要的格式变更
          if git grep -n "[[:blank:]]$" -- "templates/"; then
            echo "::error::发现行尾有多余空格，请移除！"
            exit 1
          fi || true

      - name: Check templates can be aggregated into bundle
        run: |
          # 只验证聚合能跑通，不落盘、不与 dist/templates.toml 比对。
          # 这一步兜住两条 WebUI 依赖的硬不变式：stem 全局唯一（stem 就是导入键）、
          # 每个模板文件恰好一个 [templates.*] 表且字段扁平。
          # 产物由合入后的 Template Bundle workflow 自动生成并提交。
          python .github/scripts/bundle_templates.py --stdout > /dev/null

      - name: Remind that dist/templates.toml is generated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git -c core.quotepath=false diff --name-only "$BASE_SHA"...HEAD -- dist/templates.toml | grep -q .; then
            echo "::warning::本 PR 修改了 dist/templates.toml。该文件由 CI 在合入后自动重新生成，PR 里可以移除它（不阻塞合并）。"
          fi
